# Base Deployment for the data service.
#
# Same contract as engine, minus the downstream URLs: data is a leaf service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data
  labels:
    app.kubernetes.io/name: data
    app.kubernetes.io/part-of: bituach-yashir
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data
        app.kubernetes.io/part-of: bituach-yashir
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: bituach-app
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: data
          image: ghcr.io/danbarel78/bituach-yashir-data
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: bituach-env
          env:
            - name: SERVICE_NAME
              value: data

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
