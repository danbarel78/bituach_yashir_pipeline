# Internal-only access. ClusterIP is the default and the deliberate choice:
# engine reaches data/ingest through in-cluster DNS, never through the ingress.
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: engine
    app.kubernetes.io/part-of: bituach-yashir
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: engine
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
