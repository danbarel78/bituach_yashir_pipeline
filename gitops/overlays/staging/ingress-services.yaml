# Per-service public hostnames for the staging environment.
#
# See gitops/overlays/dev/ingress-services.yaml for the rationale: one host per
# service so https://engine.staging.bituach.localhost/ answers directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bituach-services
  labels:
    app.kubernetes.io/part-of: bituach-yashir
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - engine.staging.bituach.localhost
        - data.staging.bituach.localhost
        - ingest.staging.bituach.localhost
      secretName: bituach-tls
  rules:
    - host: engine.staging.bituach.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: engine
                port:
                  name: http
    - host: data.staging.bituach.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: data
                port:
                  name: http
    - host: ingest.staging.bituach.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingest
                port:
                  name: http
