apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production environment overlay.
#
# Differences from dev (handoff.md §4): 2 replicas per service, 200m/500m CPU,
# 256Mi/512Mi memory. Prod also has the strictest NetworkPolicy (no internet
# egress at all - enforced by Terraform, not here) and only Argo CD may apply
# changes (no human write access).
#
# Sync policy note: the prod Argo CD Application has NO automated sync. A human
# approves the sync, which is the "manual approval" gate required by §10.

namespace: bituach-prod

resources:
  - ../../base/engine
  - ../../base/data
  - ../../base/ingest
  - ingress.yaml
  - ingress-services.yaml

# Images are pinned by digest. Production is the place where this matters most:
# rollback means reverting this file to the previous digest, and "the same
# bytes" is verifiable rather than assumed.
images:
  - name: ghcr.io/danbarel78/bituach-yashir-engine
    digest: sha256:726e9f1eeea04e278ef88bbb2737c84ee1da5b803a76d7c2bfede1b058dbf4af
  - name: ghcr.io/danbarel78/bituach-yashir-data
    digest: sha256:f2b24474422ebadb5a58092842246f7118583cde1c51b2acd06b42b026e62d06
  - name: ghcr.io/danbarel78/bituach-yashir-ingest
    digest: sha256:e3dfbb844d14cb1622d2638ba318b014a33ead8e71d3d317de72811a8006c334

replicas:
  - name: engine
    count: 2
  - name: data
    count: 2
  - name: ingest
    count: 2

configMapGenerator:
  - name: bituach-env
    literals:
      - ENVIRONMENT=prod

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=bituach-yashir
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
