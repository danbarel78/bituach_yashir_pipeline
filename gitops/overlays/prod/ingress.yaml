apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bituach-ingress
  labels:
    app.kubernetes.io/part-of: bituach-yashir
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bituach.localhost
      secretName: bituach-tls
  rules:
    # Production uses the bare domain: this is the customer-facing channel.
    - host: bituach.localhost
      http:
        paths:
          - path: /engine(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: engine
                port:
                  name: http
          - path: /data(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data
                port:
                  name: http
          - path: /ingest(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ingest
                port:
                  name: http
