# Per-service public hostnames for the dev environment.
#
# The path-prefix Ingress (ingress.yaml) is convenient for one-host browsing, but
# every service also gets its own hostname so a reviewer can open
#   https://engine.dev.bituach.localhost/
# and get {"service":"engine"} directly, with no path prefix to remember.
#
# No rewrite annotation here: path "/" maps to the service root unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bituach-services
  labels:
    app.kubernetes.io/part-of: bituach-yashir
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - engine.dev.bituach.localhost
        - data.dev.bituach.localhost
        - ingest.dev.bituach.localhost
      secretName: bituach-tls
  rules:
    - host: engine.dev.bituach.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: engine
                port:
                  name: http
    - host: data.dev.bituach.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: data
                port:
                  name: http
    - host: ingest.dev.bituach.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingest
                port:
                  name: http
