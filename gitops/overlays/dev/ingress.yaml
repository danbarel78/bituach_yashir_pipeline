# Public entry point for the dev environment.
#
# One host, three path prefixes, each rewritten to "/" before reaching the pod
# (the services serve their own root). This keeps a single certificate and a
# single DNS name per environment, which is what a real customer-facing channel
# looks like - in production this would additionally carry rate limits, WAF and
# a real ACME certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bituach-ingress
  labels:
    app.kubernetes.io/part-of: bituach-yashir
  annotations:
    # /engine/anything -> /anything
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.bituach.localhost
      # Generated by scripts/gen-self-signed-cert.sh - never committed.
      secretName: bituach-tls
  rules:
    - host: dev.bituach.localhost
      http:
        paths:
          - path: /engine(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: engine
                port:
                  name: http
          - path: /data(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data
                port:
                  name: http
          - path: /ingest(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ingest
                port:
                  name: http
