# External Secrets Operator - pulls Vault values into native Kubernetes Secrets.
#
# This is the runtime half of the secrets story: pods only ever mount a normal
# Secret via secretKeyRef, so no Vault credentials and no secret values appear
# in manifests, images, or logs. The CI/CD-time half (registry credentials) is
# handled by Jenkins credentials, not by ESO.
#
# The ClusterSecretStore and the per-service ExternalSecrets are created in
# Phase 5.

installCRDs: true

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

webhook:
  create: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

certController:
  create: true
  requeueInterval: 5m
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

# ServiceMonitor CRDs are not installed in T0 (no Prometheus operator).
serviceMonitor:
  enabled: false
