[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bituach-data"
version = "0.0.0"
description = "Bituach Yashir - data service (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Daniel Barel", email = "dbarel@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.8",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "C901", "UP",
    "ANN", "SIM", "RET", "ARG",
    "PLE", "PLW", "PLR", "RUF",
]
ignore = ["ANN003", "ANN401", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
# Tests are exercised by pytest and type-checked via mypy on src; the
# TestClient surface of the installed Starlette version is not fully typed.
exclude = [".venv", "build", "dist", "tests", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-q"]

[tool.coverage.run]
source = ["data"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
